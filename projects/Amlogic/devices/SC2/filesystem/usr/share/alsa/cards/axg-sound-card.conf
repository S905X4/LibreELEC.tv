# HK1 RBOX X4: FRDDR_B -> TDMOUT_C -> I2S C -> DW-HDMI.
# Device-specific overlay; other Amlogic devices keep their AXG profile.

<confdir:pcm/hdmi.conf>

axg-sound-card.pcm.default {
	@args [ CARD ]
	@args.CARD { type string }
	type softvol
	slave.pcm {
		type plug
		slave.pcm {
			@func refer
			name {
				@func concat
				strings [
					"cards.axg-sound-card.pcm.hdmi.0:CARD=" $CARD
					",AES0=4,AES1=0,AES2=0,AES3=1"
				]
			}
		}
	}
	control {
		name "PCM Playback Volume"
		card $CARD
	}
}

axg-sound-card.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 1
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				interface PCM
				device 5
				name "IEC958 Playback Default"
				lock true
				preserve true
				optional false
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
		]
	}
}
