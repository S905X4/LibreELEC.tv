# HK1 RBOX X4: I2S C for PCM; SPDIF A for two-channel IEC61937.
# Device-specific overlay; other Amlogic devices keep their AXG profile.

<confdir:pcm/hdmi.conf>

axg-sound-card.pcm.default {
	@args [ CARD ]
	@args.CARD { type string }
	type softvol
	slave.pcm {
		type plug
		slave.pcm {
			@func refer
			name {
				@func concat
				strings [
					"cards.axg-sound-card.pcm.hdmi.0:CARD=" $CARD
					",AES0=4,AES1=0,AES2=0,AES3=1"
				]
			}
		}
	}
	control {
		name "PCM Playback Volume"
		card $CARD
	}
}

# Route on NONAUDIO, not a particular AES0 byte or the channel count.
# The raw path has no plug/softvol and rejects HBR in the kernel.
axg-sound-card.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	@func refer
	name {
		@func concat
		strings [
			"cards.axg-sound-card.pcm.sc2_hdmi."
			{ @func iand integers [ $AES0 2 ] }
			":CARD=" $CARD ",AES0=" $AES0 ",AES1=" $AES1
			",AES2=" $AES2 ",AES3=" $AES3
		]
	}
}

axg-sound-card.pcm.sc2_hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 1
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				name "SPDIF OUT EN Switch"
				lock true
				preserve true
				value false
			}
			{
				name "I2S SRC"
				lock true
				preserve true
				value "I2S C"
			}
			{
				interface PCM
				device 5
				name "IEC958 Playback Default"
				lock true
				preserve true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
			{
				name "I2S OUT EN Switch"
				lock true
				preserve true
				value true
			}
		]
	}
}

axg-sound-card.pcm.sc2_hdmi.2 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 0
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				name "I2S OUT EN Switch"
				lock true
				preserve true
				value false
			}
			{
				name "SPDIF SRC"
				lock true
				preserve true
				value "SPDIF A"
			}
			{
				name "SPDIFOUT_A Playback Gain Enable Switch"
				lock true
				preserve true
				value false
			}
			{
				name "SPDIFOUT_A Playback Channels Mix Switch"
				lock true
				preserve true
				value false
			}
			{
				name "SPDIFOUT_A Playback Switch"
				lock true
				preserve true
				value [ true true ]
			}
			{
				interface PCM
				device 0
				name "SPDIFOUT_A IEC958 Playback Default"
				lock true
				preserve true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
			{
				interface PCM
				device 6
				name "IEC958 Playback Default"
				lock true
				preserve true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
			{
				name "SPDIF OUT EN Switch"
				lock true
				preserve true
				value true
			}
		]
	}
}
